name: n8n-project2-media

services:
  project2-media:
    build:
      context: ./media-helper
    user: "10001:10001"
    read_only: true
    init: true
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 32
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=100663296,mode=1777
    ulimits:
      nofile:
        soft: 128
        hard: 128
      core: 0
    networks:
      - media
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  media:
    external: true
    name: n8n_default
